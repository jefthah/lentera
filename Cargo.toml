[package]
name = "lentera"
version = "0.1.0"
edition = "2024"
description = "Presentasi ibadah ringan untuk Windows"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
