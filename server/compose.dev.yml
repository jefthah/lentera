# PostgreSQL untuk pengembangan lokal. Hanya bisa diakses dari komputer ini.
#   docker compose -f compose.dev.yml up -d
name: lentera-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lentera
      POSTGRES_PASSWORD: lentera-dev
      POSTGRES_DB: lentera
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lentera -d lentera"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
