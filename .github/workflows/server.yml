name: Server Lentera

# Server login dan sinkron (Go + PostgreSQL) di folder server/. Workflow ini
# menguji kode dan alur deploy (server/deploy), tetapi tidak men-deploy ke VPS.
on:
  # Branch fitur diuji lewat PR-nya, jadi push hanya memicu run di main.
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

# Push baru ke PR yang sama membatalkan run lama yang belum selesai.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Server (Go + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lentera
          POSTGRES_PASSWORD: lentera-ci
          POSTGRES_DB: lentera
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lentera -d lentera"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Tes dengan PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://lentera:lentera-ci@127.0.0.1:5432/lentera?sslmode=disable
        run: go test -race -count=1 ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags='-s -w' -o lentera-server ./cmd/lentera-server

  # Menjalankan server/deploy/deploy.sh seperti di VPS, dengan rahasia acak dan
  # kunci Resend palsu (tidak ada email yang dikirim).
  deploy:
    name: Image Docker dan alur deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isi .env uji
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "LOGIN_CODE_SECRET=$(openssl rand -hex 32)"
            echo "RESEND_API_KEY=re_ci_tidak_dipakai"
            echo 'MAIL_FROM="Lentera CI <ci@example.org>"'
          } > .env
          docker compose version

      - name: Deploy pertama
        run: ./deploy.sh

      - name: API terjangkau dari host
        run: |
          curl -fsS http://127.0.0.1:8310/v1/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8310/v1/me)
          [ "$code" = 401 ] || { echo "GET /v1/me tanpa token: $code"; exit 1; }
          docker compose ps
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)")" = healthy ]

      - name: Deploy ulang (cadangan sebelum migrasi)
        run: |
          ./deploy.sh
          ls -l cadangan
          ls cadangan/lentera-*.dump

      - name: Cadangan bisa dipulihkan
        run: |
          dump=$(ls cadangan/lentera-*.dump | tail -n 1)
          docker compose exec -T postgres pg_restore --list < "$dump" | grep -q 'TABLE public profiles'

      - name: Log container
        if: always()
        run: docker compose logs --no-color

      - name: Bersihkan
        if: always()
        run: docker compose down -v
