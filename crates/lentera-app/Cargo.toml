[package]
name = "lentera-app"
description = "Lentera dengan tampilan Slint untuk Windows dan macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Nama program tetap `lentera` (lentera.exe) supaya pembaruan dari 0.1.x dan
# shortcut yang sudah ada tetap jalan.
[[bin]]
name = "lentera"
path = "src/main.rs"

[features]
# Simpan tangkapan layar PNG saat --ui-smoke-test. Hanya untuk pengembangan.
snapshot = ["dep:png"]

[dependencies]
lentera-core.workspace = true
# Laporan --ui-smoke-test.
serde_json.workspace = true
# Renderer software: tanpa OpenGL, ringan di PC lama, dan tidak memicu
# overlay driver GPU di layar proyektor (lihat prototypes/slint-spike/HASIL.md).
slint = { version = "=1.19.0", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "renderer-software", "accessibility",
    "unstable-winit-030", "raw-window-handle-06",
] }
# Dialog berkas dan pesan bawaan Windows / macOS.
rfd = { version = "0.18", default-features = false }
# Installer dan pembaruan otomatis. Versi harus sama dengan alat `vpk` di
# workflow rilis.
velopack = "=1.2.161"
png = { version = "0.18", optional = true }
# Hanya untuk membuat gambar uji di uji alur; crate yang sama sudah dipakai inti.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
slint-build = "=1.19.0"
