[workspace]
resolver = "3"
members = ["crates/*"]
# Prototipe punya Cargo.lock dan dependensi sendiri.
exclude = ["prototypes"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
# File::try_lock (kunci folder data lintas OS) stabil sejak Rust 1.89.
rust-version = "1.89"

[workspace.dependencies]
lentera-core = { path = "crates/lentera-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite dibangun dari sumber (bundled): tanpa DLL tambahan dan versi sama di
# Windows dan macOS.
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
uuid = { version = "1.29", features = ["v7"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Build uji di CI (inti.yml): optimasi seperti release, tetapi tanpa LTO dan
# dengan kompilasi paralel supaya jauh lebih cepat dibangun. Program yang
# dirilis (rilis.yml) tetap memakai profil release di atas.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
