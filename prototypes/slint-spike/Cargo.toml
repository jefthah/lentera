[package]
name = "lentera-slint-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
png = "0.18.1"
raw-window-handle = "0.6"
slint = { version = "1.19.0", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software",
    "accessibility", "unstable-winit-030",
] }

[build-dependencies]
slint-build = "1.19.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_Xps", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation"] }

# Sama dengan profil rilis Lentera v0.1.0: kecilkan ukuran program.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
