[package]
name = "lentera-win32"
description = "Tampilan Win32/GDI Lentera 0.1 untuk Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "lentera"
path = "src/main.rs"

[dependencies]
lentera-core.workspace = true
# Hanya untuk laporan --ui-smoke-test.
serde_json.workspace = true
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
] }
