[package]
name = "lentera-core"
description = "Data, impor, dan penyimpanan Lentera, tanpa kode tampilan atau API khusus OS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Pustaka per profil (lihat src/store.rs).
rusqlite.workspace = true
uuid.workspace = true
# Impor Alkitab OpenSong / Zefania XML. Sudah ikut di aplikasi lewat Slint
# (fontique, usvg), jadi tidak menambah crate baru.
roxmltree = "0.21"
# Teks Alkitab EasyWorship (.ewb) terkompresi zlib. Sudah ikut di aplikasi
# lewat Slint (png).
miniz_oxide = "0.8"
# Gambar latar: hanya JPEG dan PNG. Crate ini sudah ikut di aplikasi lewat
# Slint, jadi tidak menambah crate baru.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Klien HTTP server login dan sinkron (fitur `http`). Sudah ikut di aplikasi
# lewat Velopack dengan fitur yang sama (rustls + gzip), jadi tidak menambah
# crate baru.
ureq = { version = "3.4", optional = true }

[features]
# Klien HTTP untuk server Lentera (`sync::HttpApi`). Tanpa fitur ini inti
# tetap tanpa akses jaringan, dan sinkron bisa diuji dengan server tiruan.
http = ["dep:ureq"]
