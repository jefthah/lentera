name: Inti Lentera

on:
  push:
    branches: [main, "refactor/**", "feature/**"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/inti.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/inti.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Inti (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal -c clippy -c rustfmt
          rustup default stable

      - name: Format
        run: cargo fmt --all --check

      # lentera-core harus bisa dibangun dan lulus tes di semua OS sasaran.
      - name: Clippy inti
        run: cargo clippy -p lentera-core --all-targets --locked -- -D warnings

      - name: Tes inti
        run: cargo test -p lentera-core --locked

  win32:
    name: Aplikasi Win32 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal -c clippy
          rustup default stable

      - name: Clippy
        shell: bash
        run: cargo clippy -p lentera-win32 --all-targets --locked -- -D warnings

      - name: Build rilis
        shell: bash
        run: |
          cargo build -p lentera-win32 --release --locked
          ls -l target/release/lentera.exe

      - name: Uji alur UI
        shell: pwsh
        timeout-minutes: 3
        run: |
          $data = Join-Path $env:RUNNER_TEMP "lentera-smoke"
          $p = Start-Process -FilePath target\release\lentera.exe `
            -ArgumentList "--data-dir", "`"$data`"", "--ui-smoke-test" -Wait -PassThru
          $report = Get-Content (Join-Path $data "ui-smoke-result.json") -Raw
          Add-Content $env:GITHUB_STEP_SUMMARY "### Uji alur UI"
          Add-Content $env:GITHUB_STEP_SUMMARY '```json'
          Add-Content $env:GITHUB_STEP_SUMMARY $report
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          $report
          if ($p.ExitCode -ne 0 -or -not ($report | ConvertFrom-Json).ok) { exit 1 }

  # Tampilan baru Slint (crates/lentera-app) untuk Windows dan macOS. Build
  # memakai fitur `snapshot`, jadi uji alur juga menyimpan tangkapan layar.
  app:
    name: Aplikasi Slint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal -c clippy
          rustup default stable

      - name: Clippy
        run: cargo clippy -p lentera-app --all-targets --locked -- -D warnings

      - name: Build rilis
        run: |
          cargo build -p lentera-app --release --locked --features snapshot
          ls -l target/release/ | grep lentera-app

      # Runner macOS hanya punya satu layar virtual dan belum pernah menjalankan
      # uji ini, jadi kegagalan di macOS belum menggagalkan workflow.
      - name: Uji alur UI
        continue-on-error: ${{ runner.os == 'macOS' }}
        timeout-minutes: 3
        run: |
          data="$RUNNER_TEMP/lentera-app-smoke"
          ./target/release/lentera-app --data-dir "$data" --ui-smoke-test
          report="$data/ui-smoke-result.json"
          {
            echo "### Uji alur UI Slint (${{ matrix.os }})"
            echo '```json'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$report"
          grep -q '"ok": true' "$report"

      - name: Kumpulkan hasil
        if: always()
        run: |
          mkdir -p hasil
          cp "$RUNNER_TEMP"/lentera-app-smoke/*.png "$RUNNER_TEMP"/lentera-app-smoke/*.json hasil/ 2>/dev/null || true
          cp target/release/lentera-app target/release/lentera-app.exe hasil/ 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lentera-app-${{ matrix.os }}
          path: hasil/
          if-no-files-found: warn
