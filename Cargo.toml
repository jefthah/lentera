[workspace]
resolver = "3"
members = ["crates/*"]
# Prototipe punya Cargo.lock dan dependensi sendiri.
exclude = ["prototypes"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
# File::try_lock (kunci folder data lintas OS) stabil sejak Rust 1.89.
rust-version = "1.89"

[workspace.dependencies]
lentera-core = { path = "crates/lentera-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
