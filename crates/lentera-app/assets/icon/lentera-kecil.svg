<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Logo Lentera yang disederhanakan untuk 16–32 px (title bar, taskbar kecil):
       garis lebih tebal, api lebih besar, tanpa detail tipis.
       Setelah mengubah berkas ini, jalankan: python scripts/buat_ikon.py -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2434"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="150" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2B441" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F2B441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F28C28"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#tile)"/>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#glow)"/>
  <!-- Gantungan -->
  <path d="M110 46 A18 18 0 0 1 146 46" fill="none" stroke="#FFD683" stroke-width="14" stroke-linecap="round"/>
  <!-- Tutup -->
  <path d="M102 54 H154 L184 84 H72 Z" fill="#F7C15A" stroke="#F7C15A" stroke-width="12" stroke-linejoin="round"/>
  <!-- Kaca -->
  <path d="M86 100 H170 C188 126 188 176 170 202 H86 C68 176 68 126 86 100 Z" fill="#4A3714" stroke="#F2B441" stroke-width="18" stroke-linejoin="round"/>
  <!-- Api -->
  <g transform="translate(100 110) scale(0.58)">
    <path d="M48 0 C60 20 96 44 96 88 C96 117 74 140 48 140 C22 140 0 117 0 88 C0 64 14 48 26 38 C26 56 32 66 42 70 C36 44 38 20 48 0 Z" fill="url(#flame)"/>
    <path d="M50 66 C60 80 68 92 68 106 C68 118 60 126 50 126 C40 126 32 118 32 106 C32 94 40 82 50 66 Z" fill="#FFF3D0"/>
  </g>
  <!-- Alas -->
  <rect x="64" y="214" width="128" height="26" rx="13" fill="#EBA338"/>
</svg>
