[package]
name = "lentera-app"
description = "Lentera dengan tampilan Slint untuk Windows dan macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Nama program tetap `lentera` (lentera.exe) supaya pembaruan dari 0.1.x dan
# shortcut yang sudah ada tetap jalan.
[[bin]]
name = "lentera"
path = "src/main.rs"

[features]
# Simpan tangkapan layar PNG saat --ui-smoke-test. Hanya untuk pengembangan.
snapshot = ["dep:png"]

[dependencies]
# Fitur `http`: klien server Lentera untuk masuk dan sinkron.
lentera-core = { workspace = true, features = ["http"] }
# Token sesi disimpan di Windows Credential Manager / Keychain macOS, bukan
# di berkas biasa.
keyring = { version = "3.6.3", default-features = false, features = [
    "windows-native", "apple-native",
] }
# Laporan --ui-smoke-test.
serde_json.workspace = true
# Renderer software: tanpa OpenGL, ringan di PC lama, dan tidak memicu
# overlay driver GPU di layar proyektor (lihat prototypes/slint-spike/HASIL.md).
slint = { version = "=1.19.0", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "renderer-software", "accessibility",
    "unstable-winit-030", "raw-window-handle-06",
] }
# Dialog berkas dan pesan bawaan Windows / macOS.
rfd = { version = "0.18", default-features = false }
# Installer dan pembaruan otomatis. Versi harus sama dengan alat `vpk` di
# workflow rilis.
velopack = "=1.2.161"
png = { version = "0.18", optional = true }
# Hanya untuk membuat gambar uji di uji alur; crate yang sama sudah dipakai inti.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
# Memunculkan kotak pesan yang tersembunyi (lihat src/dialog_guard.rs). Versi
# yang sama sudah dipakai winit dan rfd.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging",
] }
# Video latar lewat Media Foundation dan Direct3D 11, bawaan Windows (lihat
# src/video.rs). Versi yang sama sudah ikut lewat dependensi lain.
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
] }

[build-dependencies]
slint-build = "=1.19.0"
